
name: Build Host API

on:
  workflow_call:
    inputs:
      configuration:
        description: .NET build configuration
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PROJECT: src/Amiasea.Enterprise.Host.Api/Amiasea.Enterprise.Host.Api.csproj
  SCHEMA_DIR: src/Amiasea.Enterprise.Host.Api/Schemas

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Configure AWS credentials for package restore
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/amiasea-enterprise-restore
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to CodeArtifact for NuGet
        shell: bash
        run: |
          set -euo pipefail

          aws codeartifact login \
            --tool dotnet \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_NUGET_REPOSITORY }}" \
            --region "$AWS_REGION"

      - name: Restore
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$PROJECT" \
            -p:Configuration="$CONFIGURATION" \
            -p:UseEndpointPackage=true

      - name: Build
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail

          dotnet build "$PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-restore \
            -p:UseEndpointPackage=true

      - name: Export GraphQL schemas
        if: inputs.configuration == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          dotnet msbuild "$PROJECT" \
            -target:ExportGraphQLSchemas \
            -property:Configuration=Release \
            -property:UseEndpointPackage=true

      - name: Verify schema output
        if: inputs.configuration == 'Release'
        shell: bash
        run: |
          set -euo pipefail

          test -d "$SCHEMA_DIR"
          if ! find "$SCHEMA_DIR" -type f -name '*.graphql' -print -quit | grep -q .; then
            echo "::error::No GraphQL schema files were exported."
            exit 1
          fi