
name: Publish Host API Schemas

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PROJECT: src/Amiasea.Enterprise.Host.Api/Amiasea.Enterprise.Host.Api.csproj
  SCHEMA_DIR: src/Amiasea.Enterprise.Host.Api/Schemas
  NUGET_PACKAGE: Amiasea.Enterprise.GraphQL.Schemas
  NPM_PACKAGE: "@amiasea/enterprise-graphql-schemas"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "::error::Expected a valid v-prefixed SemVer tag; received '$TAG'."
            exit 1
          fi

          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/amiasea-enterprise-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to CodeArtifact NuGet
        shell: bash
        run: |
          set -euo pipefail

          aws codeartifact login \
            --tool dotnet \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_NUGET_REPOSITORY }}" \
            --region "$AWS_REGION"

      - name: Restore Release dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$PROJECT" \
            -p:Configuration=Release \
            -p:UseEndpointPackage=true

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail

          dotnet build "$PROJECT" \
            --configuration Release \
            --no-restore \
            -p:UseEndpointPackage=true

      - name: Export GraphQL schema
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild "$PROJECT" \
            -target:ExportGraphQLSchemas \
            -property:Configuration=Release \
            -property:UseEndpointPackage=true

          if [[ ! -s "$SCHEMA_DIR/Core.graphql" ]]; then
            echo "::error::Expected schema file '$SCHEMA_DIR/Core.graphql' was not exported."
            exit 1
          fi

      - name: Pack NuGet schema package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          mkdir -p artifacts/nuget

          dotnet pack "$PROJECT" \
            --configuration Release \
            --no-build \
            -p:UseEndpointPackage=true \
            -p:PackageId="$NUGET_PACKAGE" \
            -p:PackageVersion="$VERSION" \
            -p:IncludeBuildOutput=false \
            -p:NoPackageAnalysis=true \
            --output artifacts/nuget

          if ! compgen -G 'artifacts/nuget/*.nupkg' > /dev/null; then
            echo "::error::NuGet schema package was not created."
            exit 1
          fi

      - name: Publish NuGet schema package
        shell: bash
        run: |
          set -euo pipefail

          dotnet nuget push artifacts/nuget/*.nupkg \
            --source "${{ vars.CODEARTIFACT_NUGET_URL }}" \
            --api-key aws \
            --skip-duplicate

      - name: Prepare npm schema package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/npm-schema-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Schemas"

          cp "$SCHEMA_DIR/Core.graphql" "$PACKAGE_DIR/Schemas/Core.graphql"

          cat > "$PACKAGE_DIR/package.json" <<EOF
          {
            "name": "${NPM_PACKAGE}",
            "version": "${VERSION}",
            "description": "Versioned GraphQL SDL schemas published by Amiasea Enterprise Host API",
            "files": [
              "Schemas/**/*.graphql"
            ]
          }
          EOF

      - name: Authenticate to CodeArtifact npm
        shell: bash
        run: |
          set -euo pipefail

          # Keep npm's authentication configuration isolated to this job.
          NPM_CONFIG_DIR="$RUNNER_TEMP/npm-config"
          mkdir -p "$NPM_CONFIG_DIR"
          echo "$NPM_CONFIG_DIR" >> "$GITHUB_PATH"

          aws codeartifact login \
            --tool npm \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_NPM_REPOSITORY }}" \
            --region "$AWS_REGION"

      - name: Publish npm schema package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/npm-schema-package"

          ENDPOINT="$(aws codeartifact get-repository-endpoint \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_NPM_REPOSITORY }}" \
            --format npm \
            --region "$AWS_REGION" \
            --query repositoryEndpoint \
            --output text)"

          if [[ -z "$ENDPOINT" || "$ENDPOINT" == "None" ]]; then
            echo "::error::Could not resolve the CodeArtifact npm repository endpoint."
            exit 1
          fi

          # CodeArtifact's npm endpoint must end with a slash.
          ENDPOINT="${ENDPOINT%/}/"

          aws codeartifact login \
            --tool npm \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_NPM_REPOSITORY }}" \
            --region "$AWS_REGION"

          npm publish "$PACKAGE_DIR" \
            --registry "$ENDPOINT" \
            --access restricted

      - name: Clean up temporary npm package
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/npm-schema-package"
          rm -rf "$RUNNER_TEMP/npm-config"