name: Host API CI/CD

on:
  push:
    branches:
      - development
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  publish-schema:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-schema.yml

  publish-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yml