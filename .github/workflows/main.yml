name: Host API CI/CD

on:
  push:
    branches:
      - gamma-development
    tags:
      - "v*"

  pull_request:
    branches:
      - gamma-development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and gamma-main ancestry
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "::error::Tag '$TAG' is not a valid v-prefixed SemVer tag."
            exit 1
          fi

          git fetch origin gamma-main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/gamma-main; then
            echo "::error::Tag '$TAG' does not point to a commit reachable from gamma-main."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gamma-development'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      configuration: Debug

  build-pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      configuration: Debug

  build-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gamma-development'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      configuration: Debug

  build-release:
    if: startsWith(github.ref, 'refs/tags/') && needs.validate-tag.result == 'success'
    needs: validate-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      configuration: Release

  publish-schema:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-schema.yml
    with:
      codeartifact_nuget_url: ${{ vars.CODEARTIFACT_GAMMA_NUGET_URL }}
      codeartifact_npm_url: ${{ vars.CODEARTIFACT_GAMMA_NPM_URL }}

  publish-image:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      ecr_repository_url: ${{ vars.ECR_GAMMA_REPOSITORY_URL }}